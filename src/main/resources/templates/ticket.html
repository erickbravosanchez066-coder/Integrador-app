<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #1e293b; }
        .ticket-bg { background-image: radial-gradient(circle at top left, transparent 15px, #fff 16px), radial-gradient(circle at top right, transparent 15px, #fff 16px), radial-gradient(circle at bottom left, transparent 15px, #fff 16px), radial-gradient(circle at bottom right, transparent 15px, #fff 16px); background-position: top left, top right, bottom left, bottom right; background-size: 51% 51%; background-repeat: no-repeat; }
        .mono-text { font-family: 'Space Mono', monospace; }
        .dashed-line { border-top: 2px dashed #e2e8f0; margin: 1.5rem 0; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-sm relative">
        <!-- Confetti o decoración (opcional) -->
        
        <div class="ticket-bg rounded-2xl shadow-2xl p-8 relative">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-green-100 text-green-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 shadow-inner">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h2 class="text-2xl font-extrabold text-gray-800">¡Pedido Recibido!</h2>
                <p class="text-sm text-gray-500 mt-1">Tu pizza ya está en la cola</p>
            </div>
            
            <div class="dashed-line"></div>
            
            <div class="flex justify-between items-center mb-4">
                <span class="text-gray-500 text-sm">Nº de Orden</span>
                <span class="font-bold text-gray-800 mono-text text-lg">#089</span>
            </div>
            <div class="flex justify-between items-center mb-4">
                <span class="text-gray-500 text-sm">Estado</span>
                <span class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide">En preparación</span>
            </div>
            <div class="flex justify-between items-center mb-4">
                <span class="text-gray-500 text-sm">Tiempo Estimado</span>
                <span class="font-bold text-gray-800 text-sm"><i class="fa-regular fa-clock text-orange-500 mr-1"></i> 12 min</span>
            </div>
            
            <div class="dashed-line"></div>
            
            <div class="mb-2">
                <div class="flex justify-between text-sm font-semibold text-gray-800">
                    <span>1x Pizza Personal (Fina)</span>
                    <span>$8.00</span>
                </div>
                <div class="text-xs text-gray-500 mt-1 ml-4">
                    + Pepperoni ($2.50)<br>
                    + Queso Extra ($1.50)
                </div>
            </div>
            
            <div class="dashed-line"></div>
            
            <div class="flex justify-between items-center text-xl font-extrabold text-gray-800">
                <span>Total</span>
                <span>$12.00</span>
            </div>
            
            <div class="mt-8 text-center">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=ORDER-089" alt="Barcode" class="w-32 mx-auto mix-blend-multiply opacity-80">
            </div>
        </div>

        <button onclick="window.location.href='/cola'" class="w-full mt-6 bg-white/10 hover:bg-white/20 text-white py-4 rounded-xl font-semibold backdrop-blur-md transition-colors border border-white/20">
            Volver a la Cola Virtual
        </button>
    </div>

</body>
</html>
