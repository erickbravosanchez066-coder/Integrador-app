<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Mesa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .glass-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        }
        .mesa-card.selected { border-color: #f97316; background-color: #fff7ed; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="glass-header sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <a href="/cola" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-700">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <h1 class="text-xl font-semibold text-gray-800">Elegir Mesa</h1>
        </div>
    </header>

    <main class="flex-1 p-6 max-w-md mx-auto w-full">
        
        <!-- Pestañas de Zona -->
        <div class="flex bg-gray-100 p-1 rounded-xl mb-6">
            <button class="flex-1 py-2 text-sm font-medium bg-white shadow-sm rounded-lg text-gray-800">Interior</button>
            <button class="flex-1 py-2 text-sm font-medium text-gray-500">Terraza</button>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div th:each="mesa : ${mesas}" class="mesa-card bg-white rounded-2xl p-4 border-2 border-transparent shadow-sm cursor-pointer transition-all hover:border-orange-200" onclick="selectMesa(this)">
                <div class="flex justify-between items-start mb-3">
                    <span class="text-2xl font-bold text-gray-800" th:text="${mesa.numero}">01</span>
                    <i class="fa-solid fa-chair text-gray-300"></i>
                </div>
                <div class="text-sm text-gray-500 mb-1" th:text="${mesa.ubicacion}">Interior</div>
                <div class="text-xs font-medium text-green-500 bg-green-50 inline-block px-2 py-1 rounded">
                    <i class="fa-solid fa-user-group text-[10px]"></i> <span th:text="${mesa.capacidad}">4</span> px
                </div>
            </div>
        </div>

    </main>

    <div class="fixed bottom-0 w-full p-4 bg-white border-t border-gray-100 shadow-[0_-10px_20px_rgba(0,0,0,0.03)] max-w-md mx-auto left-0 right-0">
        <a href="/personalizar" class="w-full bg-black text-white py-4 rounded-xl font-semibold text-lg flex items-center justify-center gap-2 hover:bg-gray-800 transition-colors">
            Continuar <i class="fa-solid fa-arrow-right"></i>
        </a>
    </div>

    <script>
        function selectMesa(element) {
            document.querySelectorAll('.mesa-card').forEach(el => el.classList.remove('selected', 'border-orange-500'));
            element.classList.add('selected', 'border-orange-500');
        }
    </script>
</body>
</html>
