<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Caesars - Bienvenido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
        .btn-primary {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 75, 43, 0.4);
        }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center overflow-hidden">

    <div class="glass-card w-[90%] max-w-md rounded-3xl p-8 text-center relative overflow-hidden">
        <!-- Decoration -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-orange-400 rounded-full mix-blend-multiply filter blur-2xl opacity-50"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-red-400 rounded-full mix-blend-multiply filter blur-2xl opacity-50"></div>
        
        <div class="relative z-10">
            <img src="Logo.png" alt="Logo" class="w-24 h-24 mx-auto mb-6">
            
            <h1 class="text-3xl font-extrabold text-gray-800 mb-2">¡Bienvenido!</h1>
            <p class="text-gray-500 mb-8 font-light">Escanea el QR para ingresar a nuestra cola virtual y pide tu pizza sin hacer filas físicas.</p>
            
            <div class="bg-white p-4 rounded-2xl shadow-sm inline-block mb-8 border border-gray-100 pulse">
                <!-- QR Mock -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=http://localhost:8080/cola" alt="QR Code" class="w-40 h-40">
            </div>
            
            <a href="/cola" class="btn-primary block w-full py-4 rounded-xl text-white font-semibold text-lg uppercase tracking-wide">
                <i class="fa-solid fa-qrcode mr-2"></i> Simular Escaneo
            </a>
        </div>
    </div>

</body>
</html>
