<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea tu Pizza</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .glass-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        }
        .option-radio:checked + label {
            border-color: #f97316;
            background-color: #fff7ed;
            color: #ea580c;
        }
        .ingrediente-card.active {
            border-color: #f97316;
            background-color: #fff7ed;
        }
    </style>
</head>
<body class="min-h-screen pb-32">

    <header class="glass-header sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <a href="/mesas" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-700">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <h1 class="text-xl font-bold text-gray-800">Arma tu Pizza</h1>
        </div>
    </header>

    <main class="p-6 max-w-md mx-auto">
        <!-- Visualización de la Pizza -->
        <div class="flex justify-center mb-8 relative">
            <div class="w-48 h-48 rounded-full bg-orange-100 flex items-center justify-center relative shadow-inner">
                <img src="https://cdn-icons-png.flaticon.com/512/3595/3595458.png" alt="Pizza Base" class="w-40 h-40 object-contain drop-shadow-xl animate-[spin_20s_linear_infinite]">
            </div>
        </div>

        <form action="/confirmar" method="post" id="pizzaForm">
            <!-- Tamaño -->
            <section class="mb-8">
                <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <span class="bg-black text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">1</span> Tamaño
                </h2>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <input type="radio" name="tamano" id="tam_personal" value="PERSONAL" class="hidden option-radio" checked>
                        <label for="tam_personal" class="block border-2 border-gray-100 rounded-xl p-3 text-center cursor-pointer transition-all hover:border-gray-300 font-semibold text-gray-600 text-sm">
                            Personal<br><span class="text-xs font-normal opacity-70">$8.00</span>
                        </label>
                    </div>
                    <div>
                        <input type="radio" name="tamano" id="tam_mediana" value="MEDIANA" class="hidden option-radio">
                        <label for="tam_mediana" class="block border-2 border-gray-100 rounded-xl p-3 text-center cursor-pointer transition-all hover:border-gray-300 font-semibold text-gray-600 text-sm">
                            Mediana<br><span class="text-xs font-normal opacity-70">$14.00</span>
                        </label>
                    </div>
                    <div>
                        <input type="radio" name="tamano" id="tam_familiar" value="FAMILIAR" class="hidden option-radio">
                        <label for="tam_familiar" class="block border-2 border-gray-100 rounded-xl p-3 text-center cursor-pointer transition-all hover:border-gray-300 font-semibold text-gray-600 text-sm">
                            Familiar<br><span class="text-xs font-normal opacity-70">$20.00</span>
                        </label>
                    </div>
                </div>
            </section>

            <!-- Masa -->
            <section class="mb-8">
                <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <span class="bg-black text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">2</span> Tipo de Masa
                </h2>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <input type="radio" name="masa" id="masa_fina" value="FINA" class="hidden option-radio" checked>
                        <label for="masa_fina" class="block border-2 border-gray-100 rounded-xl py-3 text-center cursor-pointer transition-all hover:border-gray-300 font-semibold text-gray-600 text-sm">Fina</label>
                    </div>
                    <div>
                        <input type="radio" name="masa" id="masa_gruesa" value="GRUESA" class="hidden option-radio">
                        <label for="masa_gruesa" class="block border-2 border-gray-100 rounded-xl py-3 text-center cursor-pointer transition-all hover:border-gray-300 font-semibold text-gray-600 text-sm">Gruesa</label>
                    </div>
                    <div>
                        <input type="radio" name="masa" id="masa_artesanal" value="ARTESANAL" class="hidden option-radio">
                        <label for="masa_artesanal" class="block border-2 border-gray-100 rounded-xl py-3 text-center cursor-pointer transition-all hover:border-gray-300 font-semibold text-gray-600 text-sm">Artesanal</label>
                    </div>
                </div>
            </section>

            <!-- Ingredientes Extras -->
            <section class="mb-8">
                <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <span class="bg-black text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">3</span> Extras
                </h2>
                <div class="grid grid-cols-2 gap-4">
                    <div th:each="ingrediente : ${ingredientes}" class="ingrediente-card bg-white border-2 border-gray-100 rounded-2xl p-4 flex flex-col items-center justify-center gap-2 cursor-pointer transition-all" onclick="toggleIngrediente(this)">
                        <input type="checkbox" name="ingredientes" th:value="${ingrediente.id}" class="hidden ingredient-checkbox">
                        <img th:src="${ingrediente.imagenUrl}" alt="Ingrediente" class="w-12 h-12 object-contain drop-shadow-sm">
                        <span class="font-semibold text-gray-700 text-sm mt-1" th:text="${ingrediente.nombre}">Pepperoni</span>
                        <span class="text-orange-500 font-bold text-xs" th:text="'+$' + ${ingrediente.precioExtra}">+$2.50</span>
                    </div>
                </div>
            </section>
        </form>
    </main>

    <!-- Barra de total fija -->
    <div class="fixed bottom-0 w-full p-4 bg-white border-t border-gray-100 shadow-[0_-10px_30px_rgba(0,0,0,0.05)] max-w-md mx-auto left-0 right-0 z-50">
        <div class="flex justify-between items-center mb-4">
            <span class="text-gray-500 font-medium">Total Estimado</span>
            <span class="text-2xl font-extrabold text-gray-800" id="totalPrice">$8.00</span>
        </div>
        <button type="submit" form="pizzaForm" class="w-full bg-gradient-to-r from-orange-500 to-red-500 text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:shadow-xl transition-all flex justify-center items-center gap-2">
            Confirmar Pedido <i class="fa-solid fa-check-circle"></i>
        </button>
    </div>

    <script>
        function toggleIngrediente(card) {
            const checkbox = card.querySelector('.ingredient-checkbox');
            checkbox.checked = !checkbox.checked;
            if(checkbox.checked) {
                card.classList.add('active', 'border-orange-500');
            } else {
                card.classList.remove('active', 'border-orange-500');
            }
            // Aquí se podría actualizar el precio total usando JS
        }
    </script>
</body>
</html>
