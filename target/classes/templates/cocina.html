<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Display System (KDS)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .order-card { background: #1e293b; border-left: 4px solid #3b82f6; transition: transform 0.2s; }
        .order-card:hover { transform: translateY(-2px); }
        .order-urgent { border-left-color: #ef4444; background: #3f1e1e; }
        .order-ready { border-left-color: #10b981; background: #1a352a; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Navbar -->
    <nav class="bg-gray-900 border-b border-gray-800 p-4 flex justify-between items-center shadow-md z-10">
        <div class="flex items-center gap-3">
            <img src="https://upload.wikimedia.org/wikipedia/en/thumb/3/30/Little_Caesars_pizza_logo.svg/1200px-Little_Caesars_pizza_logo.svg.png" alt="Logo" class="w-10 h-10 bg-white rounded-full p-1">
            <h1 class="text-xl font-bold tracking-wide">KITCHEN <span class="text-orange-500">SYSTEM</span></h1>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-sm font-medium"><i class="fa-regular fa-clock text-gray-400"></i> <span id="clock">12:00:00</span></div>
            <button class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg text-sm font-semibold transition-colors">
                <i class="fa-solid fa-expand mr-1"></i> Pantalla Completa
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 flex gap-4 p-4 overflow-hidden">
        
        <!-- Column 1: Recibidos (New Orders) -->
        <div class="flex-1 flex flex-col bg-gray-800/50 rounded-xl overflow-hidden border border-gray-800">
            <div class="bg-gray-800 p-3 text-center font-bold border-b border-gray-700 flex justify-between items-center">
                <span>NUEVOS (RECIBIDOS)</span>
                <span class="bg-blue-500 text-white text-xs px-2 py-1 rounded-full">3</span>
            </div>
            <div class="p-4 overflow-y-auto flex-1 space-y-4">
                <!-- Mock Order 1 -->
                <div class="order-card p-4 rounded-lg shadow-lg">
                    <div class="flex justify-between items-start mb-2">
                        <span class="font-bold text-xl text-white">#089</span>
                        <span class="text-xs font-semibold bg-gray-700 px-2 py-1 rounded text-gray-300">02:30 min</span>
                    </div>
                    <div class="text-sm text-gray-400 mb-3"><i class="fa-solid fa-chair mr-1"></i> Mesa 04 (Terraza)</div>
                    <ul class="text-sm space-y-1 mb-4 font-medium text-gray-200">
                        <li>1x Familiar (Gruesa)</li>
                        <li class="pl-4 text-gray-400 text-xs">- Pepperoni</li>
                        <li class="pl-4 text-gray-400 text-xs">- Extra Queso</li>
                    </ul>
                    <button class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded text-sm transition-colors">
                        Mover a Preparación
                    </button>
                </div>
            </div>
        </div>

        <!-- Column 2: En Preparación / Horno -->
        <div class="flex-1 flex flex-col bg-gray-800/50 rounded-xl overflow-hidden border border-gray-800">
            <div class="bg-gray-800 p-3 text-center font-bold border-b border-gray-700 flex justify-between items-center text-yellow-500">
                <span>EN HORNO</span>
                <span class="bg-yellow-500 text-white text-xs px-2 py-1 rounded-full">1</span>
            </div>
            <div class="p-4 overflow-y-auto flex-1 space-y-4">
                 <!-- Mock Order 2 -->
                 <div class="order-card order-urgent p-4 rounded-lg shadow-lg">
                    <div class="flex justify-between items-start mb-2">
                        <span class="font-bold text-xl text-white">#085</span>
                        <span class="text-xs font-semibold bg-red-500 px-2 py-1 rounded text-white animate-pulse">15:40 min</span>
                    </div>
                    <div class="text-sm text-gray-400 mb-3"><i class="fa-solid fa-person-walking mr-1"></i> Para Llevar</div>
                    <ul class="text-sm space-y-1 mb-4 font-medium text-gray-200">
                        <li>2x Personal (Fina)</li>
                    </ul>
                    <button class="w-full bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-2 rounded text-sm transition-colors">
                        Marcar Listo
                    </button>
                </div>
            </div>
        </div>

        <!-- Column 3: Listos para entregar -->
        <div class="flex-1 flex flex-col bg-gray-800/50 rounded-xl overflow-hidden border border-gray-800">
            <div class="bg-gray-800 p-3 text-center font-bold border-b border-gray-700 flex justify-between items-center text-green-500">
                <span>LISTOS</span>
                <span class="bg-green-500 text-white text-xs px-2 py-1 rounded-full">2</span>
            </div>
            <div class="p-4 overflow-y-auto flex-1 space-y-4">
                 <!-- Mock Order 3 -->
                 <div class="order-card order-ready p-4 rounded-lg shadow-lg">
                    <div class="flex justify-between items-start mb-2">
                        <span class="font-bold text-xl text-white">#082</span>
                    </div>
                    <div class="text-sm text-gray-400 mb-3"><i class="fa-solid fa-chair mr-1"></i> Mesa 01</div>
                    <button class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-2 rounded text-sm transition-colors mt-4">
                        Entregado
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        // Reloj simple
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }, 1000);
    </script>
</body>
</html>
